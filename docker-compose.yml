version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: vibeconnect-postgres
    restart: always
    environment:
      POSTGRES_USER: vibeuser
      POSTGRES_PASSWORD: vibepassword2026
      POSTGRES_DB: vibeconnect_db
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vibeuser -d vibeconnect_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vibeconnect-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - JWT_SECRET=vibeconnect_production_secret_key_2026
      - DATABASE_URL=postgresql://vibeuser:vibepassword2026@postgres:5432/vibeconnect_db?schema=public
      - ALLOWED_ORIGINS=*
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:5000
    container_name: vibeconnect-frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost:5000
    depends_on:
      - backend

volumes:
  postgres-data:
